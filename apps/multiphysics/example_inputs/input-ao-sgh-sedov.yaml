# AO_SGH3D Sedov blast (octant). gamma = 5/3, rho = 1. Kamm-calibrated
# E_total = 0.493390 -> E_octant = 0.0616738 in the origin region.
# Shock reaches r = 1 at t = 1. Slip on all six faces.

dynamic_options:
    time_final: 1.0
    dt_min: 1.0e-8
    dt_max: 1.0e-2
    dt_start: 1.0e-5
    dt_cfl: 0.5
    cycle_stop: 100000

mesh_options:
    source: generate
    num_dims: 3
    type: box
    origin: [0.0, 0.0, 0.0]
    length: [1.2, 1.2, 1.2]
    num_elems: [12, 12, 12]
    polynomial_order: 3

output_options:
    timer_output_level: thorough
    output_file_format: viz
    graphics_time_step: 0.1
    node_field_outputs:
        - vel

solver_options:
  - solver:
        method: ao_dynx_FE
        id: 0
        # options: ssprk3 (explicit RK3) | rk2avg | rk3hc
        # (rk2avg / rk3hc are conservative IMEX, 2nd / 3rd order; default rk3hc)
        time_integration: rk3hc

boundary_conditions:
    - boundary_condition:
        solver_id: 0
        surface:
            type: x_plane
            plane_position: 0.0
            tolerance: 1.0e-5
        velocity_model: reflected
        velocity_bc_global_vars:
            - 1
            - 0
            - 0
    - boundary_condition:
        solver_id: 0
        surface:
            type: x_plane
            plane_position: 1.2
            tolerance: 1.0e-5
        velocity_model: reflected
        velocity_bc_global_vars:
            - 1
            - 0
            - 0
    - boundary_condition:
        solver_id: 0
        surface:
            type: y_plane
            plane_position: 0.0
            tolerance: 1.0e-5
        velocity_model: reflected
        velocity_bc_global_vars:
            - 0
            - 1
            - 0
    - boundary_condition:
        solver_id: 0
        surface:
            type: y_plane
            plane_position: 1.2
            tolerance: 1.0e-5
        velocity_model: reflected
        velocity_bc_global_vars:
            - 0
            - 1
            - 0
    - boundary_condition:
        solver_id: 0
        surface:
            type: z_plane
            plane_position: 0.0
            tolerance: 1.0e-5
        velocity_model: reflected
        velocity_bc_global_vars:
            - 0
            - 0
            - 1
    - boundary_condition:
        solver_id: 0
        surface:
            type: z_plane
            plane_position: 1.2
            tolerance: 1.0e-5
        velocity_model: reflected
        velocity_bc_global_vars:
            - 0
            - 0
            - 1

materials:
    - material:
        id: 0
        eos_model_type: decoupled
        eos_model: gamma_law_gas
        dissipation_model: MARS
        dissipation_global_vars:
            - 1.0
            - 1.0
            - 1.333
            - 1.333
            - 0
            - 1.0
        eos_global_vars:
            - 1.666666666666667
            - 1.0e-14
            - 1.0

regions:
    - region:
        id: 0
        volume:
            type: global
        solver_id: 0

    - region:
        id: 1
        volume:
            type: sphere
            radius1: 0.0
            radius2: 0.09
        solver_id: 0

initial_conditions:
    - initial_condition:
        region_id: 0
        material_id: 0
        density:
            type: uniform
            value: 1.0
        specific_internal_energy:
            type: uniform
            value: 1.0e-10
        velocity:
            type: cartesian
            u: 0.0
            v: 0.0
            w: 0.0

    - initial_condition:
        region_id: 1
        material_id: 0
        density:
            type: uniform
            value: 1.0
        specific_internal_energy:
            type: uniform
            value: 61.67375002
        velocity:
            type: cartesian
            u: 0.0
            v: 0.0
            w: 0.0
