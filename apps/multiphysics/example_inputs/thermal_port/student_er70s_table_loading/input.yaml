dynamic_options:
    time_final: 0.1
    dt_min: 1.e-10
    dt_max: 0.01
    dt_start: 0.01
    cycle_stop: 10000
mesh_options:
    source: generate
    num_dims: 3
    type: box
    origin: [0.0, 0.0, 0.0]
    length: [1.0, 1.0, 1.0]
    num_elems: [4, 4, 4]
output_options:
    output_file_format: viz_and_state
    graphics_time_step: 0.1
    node_field_outputs:
      - coords
      - temp
      - mass
    mat_pt_field_outputs:
      - heat_flux
solver_options:
  - solver:
        method: thrmex_FE
        id: 0
        use_moving_heat_source: true
laser_options:
    model: spherical
    radius: 2.0
    path: laser.csv
materials:
  - material:
        id: 0
        phase_change:
            solidus: 1675.0
            liquidus: 1708.0
            latent_heat: 260000000000.0
            initial_phase: solid
        tabular_model:
            type: temperature_dependent
            file_format: Abaqus_jmatpro
            tabular_data: student_er70s_tables.inp
            fields:
              - density_powder
              - thermal_conductivity_powder
              - specific_heat_powder
              - density_solid
              - thermal_conductivity_solid
              - specific_heat_solid
              - density_liquid
              - thermal_conductivity_liquid
              - specific_heat_liquid
        eos_model_type: decoupled
        eos_model: gamma_law_gas
        eos_global_vars:
          - 1.666666666666667
          - 1.e-14
          - 1.0
regions:
  - region:
        id: 0
        volume:
            type: global
        solver_id: 0
initial_conditions:
  - initial_condition:
        region_id: 0
        material_id: 0
        density:
            type: uniform
            value: 7.67873e-9
        specific_internal_energy:
            type: uniform
            value: 1.e-10
        velocity:
            type: cartesian
            u: 0.0
            v: 0.0
            w: 0.0
        thermal_conductivity:
            type: uniform
            value: 1.0
        specific_heat:
            type: uniform
            value: 435000000.0
        temperature:
            type: uniform
            value: 500.0
