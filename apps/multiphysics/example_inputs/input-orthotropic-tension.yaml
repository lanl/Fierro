# num_dims: 3

dynamic_options:
    time_final: 130.0
    dt_min: 1.e-8
    dt_max: 0.1
    dt_start: 1.e-6
    cycle_stop: 100000


# mesh_options:
#     source: file
#     file_path: /var/tmp/repos/Fierro/fork/Fierro/testing/meshes/mesh_Sedov_8.geo

mesh_options:
    source: generate
    num_dims: 3
    type: box
    origin: [0.0, 0.0]
    length: [3.81, 0.38, 0.38]
    num_elems: [24, 12, 12]
    #source: file
    #file_path: ./mesh_z_taylorAnvil.geo
    #scale_x: 0.1 # scale the mesh to be in cm units 
    #scale_y: 0.1
    #scale_z: 0.1
    # Mesh = 38.1 mm (radius) x 381 mm (length)


output_options:
    timer_output_level: thorough
    # Output format for visualization.
    output_file_format: viz # only options are viz or viz_and_state
    # Amount of simulated time between visualization dumps (microseconds).
    graphics_time_step: 1
    # graphics_iteration_step: 10
    elem_field_outputs:
        - den
        - stress
        - sie
        - mass
    mat_pt_field_outputs:
        - den
        - stress
        - sie
        - volfrac
    node_field_outputs:
        - vel
        - mass

solver_options:
  - solver:
        method: dynx_FE
        id: 0
        # solver_vars:
        #  - blah
        #  - blah
        #  - blah

boundary_conditions:
    # Tag X plane
    - boundary_condition:
        solver_id: 0
        surface: 
            type: x_plane
            plane_position: 0.0
        velocity_model: reflected
        velocity_bc_global_vars:
            - 1   # x
            - 0   # y
            - 0   # z


    # Tag x plane: piston driven at x=3.81
    - boundary_condition:
        solver_id: 0
        surface: 
            type: x_plane
            plane_position: 3.81
            # Piston direction is specified by the first 3 entries below.
        velocity_model: piston
        velocity_bc_global_vars:
            # Piston direction vector (normal to the driven face):
            - 1   # x
            - 0   # y
            - 0   # z
            #
            # Piston velocity polynomial coefficients along the piston direction.
            # Let dt = time_value - t_start. For t_start <= time_value <= t_end:
            #   v(dt) = v0 + v1*dt + 0.5*v2*dt^2
            # where v0/v1/v2 correspond to hydro_bc_vel_0/1/2.
            - 0.001   # hydro_bc_vel_0 
            - 0.0 # hydro_bc_vel_1 
            - 0.0  # hydro_bc_vel_2 
            - 0.0  # t_start
            - 100  # t_end
  
materials:

    - material:
        id: 0  # othortopic carbon fiber plate

        #------Strength
        # values are MBar = 10^11 Pa = 100GPa 
        strength_model_type: state_based
        strength_model: orthotropic_linear_elastic
        strength_global_vars:
            # copper: x-transverse, y-rolled direction, z-normal direction
            - 1.28 # E1   (TD Young's Modulus)          
            - 1.15 # E2   (RD Young's Modulus)          
            - 1.20 # E3   (ND Young's Modulus)          
            - 0.35 # nu12 (Poisson's Ratio TD-RD)          
            - 0.38 # nu13 (Poisson's Ratio TD-ND)          
            - 0.32 # nu23 (Poisson's Ratio RD-ND)          
            - 0.42 # G12  (In-plane Shear TD-RD)  
            - 0.48 # G13  (Out-of-plane Shear TD-ND) 
            - 0.45 # G23  (Out-of-plane Shear RD-ND)        
            - 0.01 #min sound speed
        #
        # isotopic steel
        #    - 2.0 # E1  
        #    - 2.0 # E2 
        #    - 2.0 # E3  
        #    - 0.3 # nu12 
        #    - 0.3 # nu13 
        #    - 0.3 # nu23 
        #    - 0.8 # G12 
        #    - 0.8 # G13 
        #    - 0.8 # G23   
        #    - 0.01 #min sound speed
        # ------ArtVisc
        dissipation_model: MARS
        dissipation_global_vars:
            - 1.0   # q1
            - 1.333 # q1ex
            - 1.0   # q2
            - 1.333 # q2ex
            - 0.5   # min limiter
            - 1.0


regions:
    # fill with gas
    - region:
        id: 0
        volume:
            type: global
        
initial_conditions:

    - initial_condition:
        region_id: 0
        material_id: 0
        density: 
            type: uniform
            value: 9.00
        specific_internal_energy: 
            type: uniform
            value: 1.e-10
        velocity:
            type: cartesian
            u: 0.0  
            v: 0.0
            w: 0.0
        material_volume_fraction:
            type: uniform
            value: 1.0